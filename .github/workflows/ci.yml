name: Legal AI — Build & Test Pipeline

on:
  push:
    branches: [feature/chat-memory, main, feat/evidence-logging, feature/pdf-ingestion]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # ============================================================
    # CHECKOUT
    # ============================================================
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ============================================================
    # PYTHON SETUP
    # ============================================================
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    # ============================================================
    # INSTALL DEPENDENCIES
    # ============================================================
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    # ============================================================
    # CACHE HUGGINGFACE MODELS (for fast embedding loading)
    # ============================================================
    - name: Cache Hugging Face models
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-hf-models

    # ============================================================
    # PRE-DOWNLOAD HUGGINGFACE MODELS (if not cached)
    # ============================================================
    - name: Pre-download Hugging Face model
      run: |
        python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('BAAI/bge-small-en-v1.5')"

    # ============================================================
    # INITIALIZE TEST DATABASE COLLECTIONS & INDEXES
    # ============================================================
    - name: Initialize Test Database
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
      run: |
        python -u src/scripts/setup_test_db.py

    # ============================================================
    # RUN DIAGNOSTICS FOR GEMINI & DB RETRIEVAL
    # ============================================================
    - name: Run Gemini & DB CI Diagnostics
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: |
        python -u tests/diagnostics/diagnose_gemini.py

    # ============================================================
    # RUN 3-QUESTION RAG PIPELINE TEST (reads from existing Atlas DB)
    # ============================================================
    - name: Run RAG Pipeline Test (3 Questions)
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_API_KEYS }}
        GROQ_API_KEYS: ${{ secrets.GROQ_API_KEY || secrets.GROQ_API_KEYS }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        HF_HUB_OFFLINE: "1"
        TRANSFORMERS_OFFLINE: "1"
      run: |
        python -u tests/e2e/test_rag_pipeline.py

    # ============================================================
    # RUN CHAT MEMORY E2E TEST (performs CRUD + follow-up test in Atlas)
    # ============================================================
    - name: Run Chat Memory Test
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_API_KEYS }}
        GROQ_API_KEYS: ${{ secrets.GROQ_API_KEY || secrets.GROQ_API_KEYS }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        LLM_PROVIDER: "groq"
        HF_HUB_OFFLINE: "1"
        TRANSFORMERS_OFFLINE: "1"
      run: |
        python -u tests/e2e/test_chat_memory.py

    # ============================================================
    # RUN PDF INGESTION & SESSION CHAT E2E TEST (in test collection)
    # ============================================================
    - name: Run PDF Ingestion Test
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_API_KEYS }}
        GROQ_API_KEYS: ${{ secrets.GROQ_API_KEY || secrets.GROQ_API_KEYS }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        LLM_PROVIDER: "gemini"
        HF_HUB_OFFLINE: "1"
        TRANSFORMERS_OFFLINE: "1"
      run: |
        python -u tests/e2e/test_pdf_ingestion.py




    # ============================================================
    # UPLOAD TEST REPORTS
    # ============================================================
    - name: Upload PDF Ingestion Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pdf-ingestion-report
        path: resources/reports/pdf_ingestion_report.md




